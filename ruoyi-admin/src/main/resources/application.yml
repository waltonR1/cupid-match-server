# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  # 这里只填服务器本地磁盘路径，不填 CDN URL；公开图片由 /profile/** 暴露，C 端通过 VITE_ASSET_BASE_URL 切换后端域名或 CDN 域名。
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # SMTP 邮件配置；真实值通过环境变量提供
  mail:
    # SMTP 服务地址，例如 Resend 使用 smtp.resend.com
    host: ${CUPID_SMTP_HOST:localhost}
    # SMTP 服务端口；587 通常配合 STARTTLS
    port: ${CUPID_SMTP_PORT:587}
    # SMTP 登录用户名，例如 Resend 固定使用 resend
    username: ${CUPID_SMTP_USERNAME:}
    # SMTP 登录密码或供应商 API Key，仅通过环境变量提供
    password: ${CUPID_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # 是否启用 SMTP 身份认证
          auth: true
          starttls:
            # 是否通过 STARTTLS 加密 SMTP 连接
            enable: true
          # 防止外部 SMTP 异常时长期占用验证码投递线程
          # 建立 SMTP 连接的最长等待时间，单位：毫秒
          connectiontimeout: 30000
          # 等待 SMTP 服务端响应的最长时间，单位：毫秒
          timeout: 30000
          # 写入邮件内容的最长等待时间，单位：毫秒
          writetimeout: 30000
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${CUPID_REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${CUPID_REDIS_PORT:6379}
      # 数据库索引
      database: ${CUPID_REDIS_DATABASE:0}
      # 用户名
      username: ${CUPID_REDIS_USERNAME:}
      # 密码
      password: ${CUPID_REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

cupid:
  auth:
    # 开发环境验证码调试开关，开启后只输出日志，不调用 Email 或 SMS
    verification-code-log-enabled: false
    verification-delivery:
      email:
        # Email 验证码发送开关的启动兜底；sys_config 对应值可热覆盖
        enabled: false
        # 发件地址，必须属于邮件供应商允许或已验证的域名
        from: ${CUPID_MAIL_FROM:}
      sms:
        # SMS 验证码发送开关的启动兜底；sys_config 对应值可热覆盖
        enabled: false
        # 当前短信供应商标识；例如 twilio，后续可切换其他 CupidSmsGateway 实现
        provider: ${CUPID_SMS_PROVIDER:}
        twilio:
          # Twilio 主账号 SID，以 AC 开头
          account-sid: ${CUPID_TWILIO_ACCOUNT_SID:}
          # 本地联调使用；生产环境建议改用 API Key
          auth-token: ${CUPID_TWILIO_AUTH_TOKEN:}
          # 生产环境 API Key SID，以 SK 开头
          api-key: ${CUPID_TWILIO_API_KEY:}
          # 生产环境 API Key Secret
          api-secret: ${CUPID_TWILIO_API_SECRET:}
          # Messaging Service SID，以 MG 开头
          messaging-service-sid: ${CUPID_TWILIO_MESSAGING_SERVICE_SID:}
  payment:
    stripe:
      # Stripe 支付总开关；关闭时不会创建 Checkout Session
      enabled: ${CUPID_STRIPE_ENABLED:false}
      # Stripe 环境标识；test / live，用于区分 Price、Customer、Subscription 映射
      environment: ${CUPID_STRIPE_ENVIRONMENT:test}
      # Stripe Secret Key；仅从环境变量读取
      secret-key: ${CUPID_STRIPE_SECRET_KEY:}
      # Stripe Webhook Signing Secret；仅从环境变量读取
      webhook-secret: ${CUPID_STRIPE_WEBHOOK_SECRET:}
      # Checkout 成功返回地址，可包含 {CHECKOUT_SESSION_ID} 与 {ORDER_ID}
      success-url: ${CUPID_STRIPE_SUCCESS_URL:}
      # Checkout 取消返回地址，可包含 {ORDER_ID}
      cancel-url: ${CUPID_STRIPE_CANCEL_URL:}
  # 翻译配置
  translation:
    # 部署级参数；仅 enabled 可由 sys_config 热配置覆盖
    enabled: false
    # 启用后启动时检查翻译器可用性，不可用则终止启动
    fail-fast: false
    # LibreTranslate API 地址
    api-url: http://localhost:5000
    # 连接翻译器超时时间
    connect-timeout-seconds: 3
    # 等待翻译响应超时时间
    read-timeout-seconds: 10
    # 翻译失败重试配置
    retry:
      # 单条翻译任务允许执行的最大重试次数
      max-attempts: 5
      # 每轮定时任务最多处理的翻译失败记录数量
      batch-size: 100
      # 首次重试的基础等待分钟数，后续按指数退避递增
      base-delay-minutes: 5
  # 站内消息失败重试配置
  message-retry:
    # 单条消息允许执行的最大重试次数
    max-attempts: 5
    # 每轮定时任务最多处理的失败消息数量
    batch-size: 100
    # 首次重试的基础等待分钟数，后续按指数退避递增
    base-delay-minutes: 5
  # 运营数据保留期限，单位均为天
  retention:
    # 若依登录日志、操作日志和定时任务日志保留天数
    technical-log-days: 180
    # C端安全事件保留天数
    security-event-days: 365
    # 消息与翻译重试耗尽记录保留天数
    exhausted-retry-days: 90
    # 已过期安全挑战记录保留天数
    expired-challenge-days: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
